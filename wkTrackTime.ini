[general]
EnableModule = 1
UseOffsetCache = 1
IgnoreVersionCheck = 0
; 1 = load active, 0 = load disabled until /enabletracktime.
StartEnabled = 1
EnableOverlay = 1

PrimaryTimerOffset = 0x188
SecondaryTimerOffset = 0x18C
TimerTicksPerSecond = 1000

; Lower-left anchor for the overlay block.
OverlayLeftPixels = -150
; Distance from the bottom edge. Increase this if you want the box higher.
OverlayBottomPixels = 77
OverlayLineSpacingPixels = 2
OverlayPlayerSpacingPixels = 4

; Number of consecutive missing frames before a finished turn is committed.
TurnEndGraceFrames = 3

; W:A textbox palette values.
TextColor = 6
TextBackground = 21
TextFrame = 54
TextFont = 1
TextOpacity = 0x10000
